name: Bug report
description: Report a reproducible defect in VedaX
title: "bug: "
labels: [bug]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: OS, browser, Node version, commit
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
